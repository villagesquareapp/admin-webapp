name: OTel lockfile refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat-observability-otel-admin-webapp
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Resolve Next.js OpenTelemetry dependencies
        run: |
          npm install --save-exact             @vercel/otel@1.14.2             @opentelemetry/api@1.9.0             @opentelemetry/api-logs@0.57.2             @opentelemetry/instrumentation@0.57.2             @opentelemetry/sdk-logs@0.57.2
      - name: Commit deterministic lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(observability): refresh otel lockfile"
          git push origin HEAD:feat-observability-otel-admin-webapp
